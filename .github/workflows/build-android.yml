name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip ant \
            openjdk-17-jdk \
            libffi-dev libssl-dev \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libstdc++6 libgcc1

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('packaging/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          cp packaging/buildozer.spec buildozer.spec
          buildozer android debug
          mkdir -p dist
          find .buildozer -name "*.apk" -exec cp {} dist/beat-maker.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beat-maker.apk
          path: dist/beat-maker.apk
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/beat-maker.apk
